<<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Spatial Window</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
    #video { display: none; }
    #canvas { width: 100vw; height: 100vh; display: block; }
    #controls {
      position: absolute; top: 14px; left: 14px; z-index: 10;
      display: flex; gap: 8px;
    }
    button {
      background: rgba(20, 20, 25, 0.8); color: #fff; border: 1px solid rgba(255,255,255,0.3);
      padding: 9px 15px; border-radius: 20px; font-size: 13px; backdrop-filter: blur(6px);
      font-weight: 600; outline: none;
    }
    button:active { background: rgba(50, 50, 60, 0.9); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="controls">
    <button id="toggleCamBtn">🔄 Фронталка / Основная</button>
    <button id="resetWinBtn">↺ Центр</button>
  </div>

  <video id="video" playsinline></video>
  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // "user" — фронтальная (по умолчанию), "environment" — задняя
    let facingMode = "user";
    let cameraInstance = null;

    const win = {
      x: 50, y: 150, w: 260, h: 170,
      title: "Парящее окно AR",
      isDragging: false,
      dragOffsetX: 0,
      dragOffsetY: 0
    };

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 0,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    function startCamera() {
      if (cameraInstance) {
        cameraInstance.stop();
      }

      cameraInstance = new Camera(video, {
        onFrame: async () => {
          await hands.send({ image: video });
        },
        facingMode: facingMode,
        width: 1280,
        height: 720
      });
      cameraInstance.start();
    }

    function onResults(results) {
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const isFront = facingMode === "user";

      // Расчет масштаба без деформации пропорций
      const vRatio = video.videoWidth / video.videoHeight;
      const cRatio = canvas.width / canvas.height;
      let drawW = canvas.width, drawH = canvas.height;
      let offsetX = 0, offsetY = 0;

      if (vRatio > cRatio) {
        drawW = canvas.height * vRatio;
        offsetX = (canvas.width - drawW) / 2;
      } else {
        drawH = canvas.width / vRatio;
        offsetY = (canvas.height - drawH) / 2;
      }

      // 1. Отрисовка видеофона (зеркалируем только если это фронталка)
      if (isFront) {
        ctx.save();
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(results.image, offsetX, offsetY, drawW, drawH);
        ctx.restore();
      } else {
        ctx.drawImage(results.image, offsetX, offsetY, drawW, drawH);
      }

      let cursorX = null;
      let cursorY = null;
      let isPinching = false;

      // 2. Трекинг рук и совмещение с зеркальным экраном
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];

        // Точки: 4 — кончик большого, 8 — кончик указательного
        const rawThumbX = landmarks[4].x;
        const rawIndexX = landmarks[8].x;

        // Если фронталка отзеркалена — инвертируем X координату пальцев
        const thumbNormX = isFront ? (1 - rawThumbX) : rawThumbX;
        const indexNormX = isFront ? (1 - rawIndexX) : rawIndexX;

        const thumbX = offsetX + thumbNormX * drawW;
        const thumbY = offsetY + landmarks[4].y * drawH;
        const indexX = offsetX + indexNormX * drawW;
        const indexY = offsetY + landmarks[8].y * drawH;

        cursorX = indexX;
        cursorY = indexY;

        // Дистанция щипка
        const dist = Math.hypot(thumbX - indexX, thumbY - indexY);
        if (dist < 45) {
          isPinching = true;
        }

        // Логика перетаскивания окна
        if (isPinching) {
          if (!win.isDragging) {
            if (cursorX >= win.x && cursorX <= win.x + win.w &&
                cursorY >= win.y && cursorY <= win.y + win.h) {
              win.isDragging = true;
              win.dragOffsetX = cursorX - win.x;
              win.dragOffsetY = cursorY - win.y;
            }
          } else {
            win.x = cursorX - win.dragOffsetX;
            win.y = cursorY - win.dragOffsetY;
          }
        } else {
          win.isDragging = false;
        }

        drawCursor(cursorX, cursorY, isPinching);
      } else {
        win.isDragging = false;
      }

      // 3. Окно рисуется поверх (текст всегда читаемый, не отзеркаленный)
      drawWindow();

      ctx.restore();
    }

    function drawWindow() {
      // Корпус окна
      ctx.fillStyle = win.isDragging ? "rgba(25, 75, 150, 0.85)" : "rgba(18, 22, 32, 0.78)";
      ctx.strokeStyle = win.isDragging ? "#00f0ff" : "rgba(255, 255, 255, 0.35)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(win.x, win.y, win.w, win.h, 14);
      ctx.fill();
      ctx.stroke();

      // Шапка
      ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
      ctx.beginPath();
      ctx.roundRect(win.x, win.y, win.w, 34, [14, 14, 0, 0]);
      ctx.fill();

      // Текст шапки
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 13px sans-serif";
      ctx.fillText(win.title, win.x + 14, win.y + 22);

      // Инструкция внутри окна
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.font = "12px sans-serif";
      ctx.fillText("Сожми большой и указательный,", win.x + 14, win.y + 68);
      ctx.fillText("чтобы зацепить окно в воздухе", win.x + 14, win.y + 88);

      // Статус активности
      ctx.fillStyle = win.isDragging ? "#00ff88" : "rgba(255,255,255,0.25)";
      ctx.beginPath();
      ctx.arc(win.x + win.w - 18, win.y + 17, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawCursor(x, y, isPinching) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, isPinching ? 12 : 8, 0, Math.PI * 2);
      ctx.fillStyle = isPinching ? "#00ff88" : "#00f0ff";
      ctx.shadowColor = isPinching ? "#00ff88" : "#00f0ff";
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }

    document.getElementById('toggleCamBtn').addEventListener('click', () => {
      facingMode = facingMode === "user" ? "environment" : "user";
      startCamera();
    });

    document.getElementById('resetWinBtn').addEventListener('click', () => {
      win.x = (canvas.width - win.w) / 2;
      win.y = (canvas.height - win.h) / 2;
    });

    startCamera();
  </script>
</body>
</html>
