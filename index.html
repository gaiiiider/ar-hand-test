<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mobile AR Spatial Window</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
    #video { display: none; }
    #canvas { width: 100vw; height: 100vh; display: block; }
    #controls {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    button, select {
      background: rgba(20, 20, 20, 0.75); color: #fff; border: 1px solid rgba(255,255,255,0.3);
      padding: 8px 12px; border-radius: 16px; font-size: 13px; backdrop-filter: blur(6px);
      outline: none; max-width: 220px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="controls">
    <select id="camSelect"><option>Поиск камер...</option></select>
    <button id="resetWinBtn">↺ Центр</button>
  </div>

  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const camSelect = document.getElementById('camSelect');

    let currentStream = null;
    let videoDevices = [];

    const win = {
      x: 40, y: 140, w: 250, h: 160,
      title: "Парящее окно AR",
      isDragging: false,
      dragOffsetX: 0,
      dragOffsetY: 0
    };

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Инициализация MediaPipe Hands
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 0, // Ускоряет работу на мобильных чипах
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    // Поиск всех задних модулей камеры (включая 0.5x Ultra-Wide)
    async function initCameraList() {
      try {
        const initialStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        initialStream.getTracks().forEach(t => t.stop());

        const devices = await navigator.mediaDevices.enumerateDevices();
        videoDevices = devices.filter(d => d.kind === 'videoinput');

        camSelect.innerHTML = '';
        videoDevices.forEach((device, index) => {
          const opt = document.createElement('option');
          opt.value = device.deviceId;
          // Помечаем объективы (wide, ultrawide, back)
          const label = device.label.toLowerCase();
          let name = `Камера ${index + 1}`;
          if (label.includes('ultra') || label.includes('wide') || label.includes('0') || label.includes('back 0')) {
            name += ' (Широкоугольная / 0.5x)';
          } else if (label.includes('back')) {
            name += ' (Основная 1x)';
          } else if (label.includes('front')) {
            name += ' (Фронтальная)';
          }
          opt.text = device.label || name;
          camSelect.appendChild(opt);
        });

        // Пытаемся автоматически выбрать второй сенсор (часто именно он сверхширик)
        if (videoDevices.length > 1) {
          camSelect.selectedIndex = 1;
        }
        startSelectedCamera();
      } catch (err) {
        console.error("Ошибка доступа к камере:", err);
      }
    }

    async function startSelectedCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
      }

      const deviceId = camSelect.value;
      const constraints = {
        video: {
          deviceId: deviceId ? { exact: deviceId } : undefined,
          facingMode: deviceId ? undefined : { ideal: "environment" },
          // Честный вертикальный кадр под пропорции телефона
          width: { ideal: 1080 },
          height: { ideal: 2400 },
          frameRate: { ideal: 30 }
        },
        audio: false
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        video.onloadedmetadata = () => {
          video.play();
          processFrame();
        };
      } catch (err) {
        // Запасной запуск, если точные параметры не приняты
        currentStream = await navigator.mediaDevices.getUserMedia({ video: { deviceId } });
        video.srcObject = currentStream;
        video.play();
        processFrame();
      }
    }

    async function processFrame() {
      if (!video.paused && !video.ended) {
        await hands.send({ image: video });
      }
      requestAnimationFrame(processFrame);
    }

    function onResults(results) {
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Отрисовка видео с сохранением пропорций без лишнего кропа
      const vRatio = video.videoWidth / video.videoHeight;
      const cRatio = canvas.width / canvas.height;
      let drawW = canvas.width, drawH = canvas.height, offsetX = 0, offsetY = 0;

      if (vRatio > cRatio) {
        drawW = canvas.height * vRatio;
        offsetX = (canvas.width - drawW) / 2;
      } else {
        drawH = canvas.width / vRatio;
        offsetY = (canvas.height - drawH) / 2;
      }

      ctx.drawImage(results.image, offsetX, offsetY, drawW, drawH);

      let cursorX = null;
      let cursorY = null;
      let isPinching = false;

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];

        // Точки: 4 (большой палец), 8 (указательный)
        const thumbX = offsetX + landmarks[4].x * drawW;
        const thumbY = offsetY + landmarks[4].y * drawH;
        const indexX = offsetX + landmarks[8].x * drawW;
        const indexY = offsetY + landmarks[8].y * drawH;

        cursorX = indexX;
        cursorY = indexY;

        const dist = Math.hypot(thumbX - indexX, thumbY - indexY);
        if (dist < 40) isPinching = true;

        if (isPinching) {
          if (!win.isDragging) {
            if (cursorX >= win.x && cursorX <= win.x + win.w &&
                cursorY >= win.y && cursorY <= win.y + win.h) {
              win.isDragging = true;
              win.dragOffsetX = cursorX - win.x;
              win.dragOffsetY = cursorY - win.y;
            }
          } else {
            win.x = cursorX - win.dragOffsetX;
            win.y = cursorY - win.dragOffsetY;
          }
        } else {
          win.isDragging = false;
        }

        drawCursor(cursorX, cursorY, isPinching);
      } else {
        win.isDragging = false;
      }

      drawWindow();
      ctx.restore();
    }

    function drawWindow() {
      ctx.fillStyle = win.isDragging ? "rgba(20, 80, 160, 0.85)" : "rgba(18, 22, 32, 0.75)";
      ctx.strokeStyle = win.isDragging ? "#00f0ff" : "rgba(255, 255, 255, 0.3)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(win.x, win.y, win.w, win.h, 12);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
      ctx.beginPath();
      ctx.roundRect(win.x, win.y, win.w, 32, [12, 12, 0, 0]);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 13px sans-serif";
      ctx.fillText(win.title, win.x + 12, win.y + 20);

      ctx.fillStyle = "rgba(255,255,255,0.7)";
      ctx.font = "12px sans-serif";
      ctx.fillText("Сомкни пальцы (щипок),", win.x + 15, win.y + 65);
      ctx.fillText("чтобы схватить окно", win.x + 15, win.y + 85);
    }

    function drawCursor(x, y, isPinching) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, isPinching ? 12 : 8, 0, Math.PI * 2);
      ctx.fillStyle = isPinching ? "#00ff88" : "#00f0ff";
      ctx.shadowColor = isPinching ? "#00ff88" : "#00f0ff";
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.restore();
    }

    camSelect.addEventListener('change', startSelectedCamera);
    document.getElementById('resetWinBtn').addEventListener('click', () => {
      win.x = (canvas.width - win.w) / 2;
      win.y = (canvas.height - win.h) / 2;
    });

    initCameraList();
  </script>
</body>
</html>
>
